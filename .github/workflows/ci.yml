name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking: the repo has a pre-existing lint baseline (mostly
      # `catch (err: any)`). Surfaced for visibility; typecheck + build are the
      # hard gates. Tighten to blocking once the baseline is cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build needs the client env vars present; CI uses harmless placeholders
          # since we only verify the bundle compiles, not a live deploy.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
