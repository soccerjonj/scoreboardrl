name: Keep Supabase alive

# Supabase free-tier pauses projects after 7 days of inactivity.
# This hits the REST health endpoint every 4 days to stay well clear of that.
#
# Reuses existing secrets — no new secrets needed:
#   SUPABASE_FUNCTIONS_URL   e.g. https://<ref>.supabase.co/functions/v1
#   SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: "0 6 */4 * *" # 06:00 UTC every 4 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          BASE="${SUPABASE_FUNCTIONS_URL%/functions/v1}"
          echo "BASE=${BASE}"
          echo "URL length: ${#SUPABASE_FUNCTIONS_URL}, KEY length: ${#SUPABASE_SERVICE_ROLE_KEY}"

          # Decode the JWT payload (2nd segment) to inspect its non-secret
          # claims (ref, role) — only the signature is sensitive, and we
          # never print that.
          PAYLOAD_B64=$(echo "$SUPABASE_SERVICE_ROLE_KEY" | cut -d '.' -f2)
          # base64url -> base64: swap chars and pad
          PAYLOAD_B64=$(echo "$PAYLOAD_B64" | tr '_-' '/+')
          MOD=$(( ${#PAYLOAD_B64} % 4 ))
          if [ "$MOD" -eq 2 ]; then PAYLOAD_B64="${PAYLOAD_B64}=="; fi
          if [ "$MOD" -eq 3 ]; then PAYLOAD_B64="${PAYLOAD_B64}="; fi
          echo "Decoded JWT claims:"
          echo "$PAYLOAD_B64" | base64 -d 2>/dev/null || echo "  (could not base64-decode — key may not be a JWT at all)"
          echo ""

          curl -sS \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            "${BASE}/rest/v1/" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
          echo "Pinged ${BASE} — project stays awake."
        env:
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
